env:
  DIRECTORY: distribution
  PROJECT_NAME: onfire-extensions-manager

# FILE GENERATED WITH: npx ghat fregante/ghatemplates/webext
# SOURCE: https://github.com/fregante/ghatemplates
# OPTIONS: {"exclude":["jobs.Firefox"]}

name: Release
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  Version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Test and build
        run: npm test
      - name: Create tag if necessary
        uses: fregante/daily-version-action@fb1a60b7c4daf1410cd755e360ebec3901e58588 # v2
        with:
          prefix: 20 # Use YYYY.M.D instead of YY.M.D
      - name: Update manifest.json with version ${{ env.DAILY_VERSION}}
        if: env.DAILY_VERSION_CREATED
        run: node -e "const fs=require('node:fs');const p=process.env.DIRECTORY+'/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version=process.env.DAILY_VERSION;fs.writeFileSync(p,JSON.stringify(m,null,'\t')+'\n')"
      - name: Upload release artifact
        if: env.DAILY_VERSION_CREATED
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: ${{ env.DIRECTORY }}
      - name: Create release
        if: env.DAILY_VERSION_CREATED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.DIRECTORY }}
        run: |
          FILENAME="$PROJECT_NAME-$DAILY_VERSION.zip"
          zip -r "$FILENAME" ./*
          gh release create "$DAILY_VERSION" --generate-notes "$FILENAME"
